<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="okOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    
    <linearGradient id="okArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="okBoxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="okBoxSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <linearGradient id="okBoxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="okDarkStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <filter id="okGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#EA580C" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Speed Motion Trails -->
  <g fill="#EA580C" opacity="0.95">
    <rect x="75" y="108" width="28" height="7" rx="3.5" />
    <rect x="90" y="125" width="24" height="7" rx="3.5" />
    <rect x="68" y="142" width="38" height="7" rx="3.5" />
    <circle cx="85" cy="94" r="3.5" />
  </g>

  <!-- "O" Loop Outer Body -->
  <path
    d="M 230,65 C 295,65 345,105 345,155 C 345,205 285,225 215,225 C 145,225 110,185 110,140 C 110,95 160,65 230,65 Z"
    fill="none"
    stroke="url(#okOrangeGrad)"
    stroke-width="32"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#okGlow)"
  />

  <!-- "K" Vertical Charcoal Stem -->
  <path
    d="M 255,60 L 285,60 L 265,225 L 235,225 Z"
    fill="url(#okDarkStem)"
    rx="4"
  />

  <!-- "K" Lower Leg -->
  <path
    d="M 270,145 L 350,225 L 320,225 L 255,160 Z"
    fill="url(#okOrangeGrad)"
  />

  <!-- "K" Upper Ascending Arrow (Forms top arm of K and dynamic arrow) -->
  <g filter="url(#okGlow)">
    <!-- Arrow Shaft Sweeping across the O -->
    <path
      d="M 125,175 C 190,225 270,205 345,100 L 375,55 L 340,65 L 335,80 C 275,155 200,180 145,150 Z"
      fill="url(#okArrowGrad)"
    />
    <!-- Arrow Head Pointing Top-Right -->
    <path
      d="M 330,60 L 400,32 L 370,105 L 352,78 L 330,88 Z"
      fill="url(#okArrowGrad)"
    />
  </g>

  <!-- Delivery Box with Checkmark Emerging from O -->
  <g transform="translate(100, 85)" filter="url(#okGlow)">
    <!-- Box Top Face -->
    <polygon points="50,0 95,20 50,38 5,18" fill="url(#okBoxTop)" />
    <!-- Box Top Flap/Tape -->
    <polygon points="45,2 55,6 55,36 45,32" fill="#FFFFFF" opacity="0.6" />
    
    <!-- Box Right Face -->
    <polygon points="95,20 95,72 50,92 50,38" fill="url(#okBoxSide)" />
    <!-- Box Left Front Face -->
    <polygon points="5,18 50,38 50,92 5,72" fill="url(#okBoxFront)" />

    <!-- Box Front Tape Stripe -->
    <polygon points="23,26 31,29 31,84 23,80" fill="#FFFFFF" opacity="0.4" />

    <!-- Checkmark Badge on Front Box -->
    <g transform="translate(18, 42)">
      <rect x="0" y="0" width="34" height="34" rx="6" fill="#FFFFFF" opacity="0.95" />
      <!-- Checkmark -->
      <path
        d="M 7,17 L 14,24 L 27,9"
        fill="none"
        stroke="#EA580C"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
