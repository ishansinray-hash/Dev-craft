services:
  relay:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_PATH: /data/relay.db
      # Supplied by the operator's environment or .env file. Never commit a key.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-small-latest}
    volumes:
      - relay-data:/data

volumes:
  relay-data: 